name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Линтер, типы, юнит-тесты
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC-вход в Qlty для загрузки покрытия, без секретов
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # версия pnpm — из packageManager в package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Vitest с покрытием
        run: pnpm test:coverage

      # Покрытие для бейджа Qlty. Пока репозиторий не подключен к Qlty,
      # загрузка не проходит, но сборку не валит (skip-errors по умолчанию)
      - name: Загрузка покрытия в Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Одноразовая база внутри раннера: пароли здесь не секрет
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dashboard?sslmode=disable
      DB_USER_PASSWORD: ci-app-user-password
      POSTGRES_URL: postgres://dashboard_app_user:ci-app-user-password@localhost:5432/dashboard?sslmode=disable
      BETTER_AUTH_URL: http://localhost:3000
      # Все запросы тестов идут с одного IP — без этого сработал бы лимит попыток входа
      AUTH_RATE_LIMIT: "off"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Секрет Better Auth
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Миграции, тестовые данные, пользователь приложения
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:create-user

      - name: Сборка
        run: pnpm build

      - name: Браузер для Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      - name: Отчет Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
